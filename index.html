<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News — AI Media Specialist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#14213d;--muted:#657897;--line:#dce5ef;--bg:#eef3f8;--blue:#0788d1;--navy:#10192e;--orange:#f47c00;--purple:#5d3df2;--white:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif} button,input{font:inherit} button{cursor:pointer;border:0}
    .app{display:block;max-width:1440px;margin:24px auto;padding:0 24px}.main{position:relative}.topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:16px}.topbar-date{color:#445a7a;font-size:13px}.settings-button{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#55708f;box-shadow:0 3px 12px #11234b0b;font-size:18px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:30px;padding:24px 16px;box-shadow:0 3px 12px #11234b0b;min-height:calc(100vh - 48px);position:sticky;top:24px;display:flex;flex-direction:column}.logo{height:96px;display:flex;align-items:center;padding:0 12px}.logo-mark{width:48px;height:42px;background:linear-gradient(135deg,#05b6ee,#1760da);border-radius:8px 24px 8px 24px;transform:skew(-10deg);position:relative;box-shadow:12px 5px 0 #0e213c}.logo-mark:after{content:'';position:absolute;left:12px;top:8px;width:18px;height:26px;background:#fff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.logo-text{font-family:'Plus Jakarta Sans';font-size:30px;letter-spacing:-2px;margin-left:10px;color:#15243d}.logo-text b{color:#087ed0}.nav-date{background:#f0f5f9;border-radius:14px;color:#445a7a;font-size:13px;padding:8px 12px;margin:8px 0 14px}.nav{display:grid;gap:7px}.nav-item{display:flex;align-items:center;gap:12px;padding:12px 11px;border-radius:16px;color:var(--ink);font-weight:700;text-align:left;background:transparent}.nav-item:hover,.nav-item.active{background:#eef9ff;color:#087bc2;box-shadow:inset 0 0 0 1px #8ed8ff}.nav-icon{width:30px;height:30px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;color:#526a8e;font-size:15px}.nav-item.active .nav-icon{background:#06a0e7;color:#fff}.nav-label{font-size:13px}.nav-sub{display:block;color:#8ba0be;font-size:10px;font-weight:500;margin-top:2px}.badge{margin-left:auto;font-size:9px;padding:3px 7px;border-radius:8px;background:#d8f2ff;color:#0788d1}.side-bottom{margin-top:auto;display:grid;gap:8px}.vip,.promo,.login{border-radius:16px;padding:12px;text-align:left;display:flex;align-items:center;gap:9px}.vip{background:#f37c00;color:#fff}.promo{background:#fff0d4;border:1px solid #ffbd4f;color:#9c4300}.login{background:#10192e;color:#fff;justify-content:center;font-weight:700;font-size:13px}.mini{font-size:10px;display:block;font-weight:500;margin-top:2px}.action{margin-left:auto;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700;background:#fff8}.main{min-width:0}.hero{background:#fff;border:1px solid var(--line);border-radius:30px;padding:40px;box-shadow:0 3px 12px #11234b0b}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#0879ba;background:#f0faff;border:1px solid #afe4ff;border-radius:99px;padding:6px 13px;font-size:12px;font-weight:700}.dot{width:8px;height:8px;background:#65c8f5;border-radius:50%}.hero h1{font-family:'Plus Jakarta Sans';font-size:25px;letter-spacing:-1.2px;margin:18px 0 3px}.hero h1 span{color:#058bd1}.hero h3{font-size:14px;margin:0}.hero p{color:var(--muted);max-width:760px;line-height:1.6;margin:14px 0 24px;font-size:14px}.prompt{display:flex;align-items:center;border:1px solid var(--line);background:#f8fafc;border-radius:17px;padding:7px 8px 7px 16px;gap:9px}.prompt input{flex:1;border:0;background:transparent;outline:0;color:var(--muted);min-width:0}.record{background:#fff0f2;color:#dd214b;border:1px solid #ffc8d2;border-radius:13px;padding:12px 16px;font-weight:700}.primary{background:#068bd1;color:#fff;border-radius:13px;padding:13px 20px;font-weight:700;white-space:nowrap}.section-head{display:flex;align-items:end;justify-content:space-between;margin:32px 0 16px}.section-head h2{font-family:'Plus Jakarta Sans';font-size:19px;margin:0;letter-spacing:-.7px}.section-head p{color:var(--muted);font-size:13px;margin:5px 0 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px 24px;min-height:260px;box-shadow:0 3px 12px #11234b08}.card-top{display:flex;justify-content:space-between;color:#89a0bf;font-weight:700;font-size:10px;letter-spacing:1px}.tag{letter-spacing:0;background:#f1f5f9;color:#455b7a;border-radius:99px;padding:6px 10px}.card-icon{width:45px;height:45px;border-radius:15px;background:#078bd3;color:#fff;display:grid;place-items:center;font-size:22px;margin:17px 0 12px}.card:nth-child(2) .card-icon{background:#2460e9}.card:nth-child(3) .card-icon{background:#5d3df2}.card:nth-child(4) .card-icon{background:#00a998}.card:nth-child(5) .card-icon{background:#e97b00}.card:nth-child(6) .card-icon{background:#d63d83}.card h3{margin:0 0 8px;font-family:'Plus Jakarta Sans';font-size:17px}.card p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 18px}.features{display:flex;gap:7px;flex-wrap:wrap}.feature{font-size:10px;color:#526987;background:#f5f8fb;border-radius:8px;padding:6px 8px}.card-link{display:inline-block;margin-top:20px;color:#0788d1;font-weight:700;font-size:12px;text-decoration:none}.lower{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin:30px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px}.panel h2{font-family:'Plus Jakarta Sans';font-size:18px;margin:0 0 6px}.panel p{font-size:13px;color:var(--muted);line-height:1.6}.empty{border:1px dashed #c9d7e6;border-radius:16px;padding:22px;text-align:center;color:#8295af;font-size:13px}.edu{background:linear-gradient(135deg,#152d52,#123e69);color:#fff}.edu p{color:#c4daee}.edu button{background:#fff;color:#075b90;border-radius:11px;padding:10px 14px;font-weight:700}.footer{padding:8px 0 32px;color:#8192aa;font-size:12px;text-align:center}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block;padding:12px;margin:0}.hero{padding:24px}.prompt{flex-wrap:wrap}.prompt input{flex-basis:100%;order:-1;padding:8px}.cards,.lower{grid-template-columns:1fr}.section-head{display:block}.card{min-height:0}}
  </style>
</head>
<body>
  <div class="app">
    <main class="main">
      <div class="topbar"><span class="topbar-date">◷ &nbsp; <span id="systemDate"></span></span><button id="settingsOpen" class="settings-button" aria-label="Pengaturan">⚙</button></div>
      <section id="newsWorkflow" class="panel" style="display:none;margin-top:20px"><div class="section-head" style="margin-top:0"><div><h2>Alur Kerja Bikin Berita</h2><p>Tarik bahan dari beberapa URL, pilih gaya, lalu susun draf berita.</p></div><span class="tag">MULTI-URL</span></div><label style="font-size:12px;font-weight:700">Link berita / siaran pers</label><textarea id="sourceUrls" rows="4" placeholder="Satu URL per baris..." style="width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical"></textarea><div style="display:flex;gap:12px;align-items:end;margin-top:14px;flex-wrap:wrap"><label style="font-size:12px;font-weight:700;display:grid;gap:6px">Format / gaya berita<select id="newsStyle" style="padding:11px;border:1px solid var(--line);border-radius:10px;min-width:220px"><option value="straight">Straight News</option><option value="jawapos">Gaya Jawa Pos — ringkas & tajam</option><option value="feature">Feature</option><option value="opini">Opini</option><option value="breaking">Breaking News</option><option value="investigasi">Investigasi</option></select></label><button class="primary" id="researchBtn">Tarik & Gabungkan Bahan →</button></div><div id="researchStatus" style="color:var(--muted);font-size:12px;margin-top:12px"></div><textarea id="compiledMaterial" rows="7" placeholder="Hasil bahan gabungan akan muncul di sini. Kamu juga bisa mengeditnya sebelum membuat berita." style="display:none;width:100%;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px"></textarea><button class="primary" id="generateNewsBtn" style="display:none;margin-top:12px">Buat Draf Berita →</button><div id="generatedArticle" style="display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:18px"></div></section>
    </main>
  </div>
  <script>
    const now=new Date();const weekdays=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];document.getElementById('systemDate').textContent=`${weekdays[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    const modules=[['MULTIMODAL STUDIO','Paling Sering Digunakan','▤','Bikin Berita Baru','Susun naskah berita piramida terbalik dari rekaman doorstop, dokumen rilis, foto OCR, multi-link, atau transkrip audio.',['Straight, Feature, Opini','Multi-URL Scraper','OCR & Rekaman Audio']],['PARAFRASA BERITA','Anti-Plagiasi','⟳','News Rewriter','Ubah siaran pers atau berita kompetitor menjadi artikel baru dengan sudut pandang unik, tanpa kehilangan fakta.',['Variasi Angle Baru','Koreksi Struktur','Kedaulatan Fakta']],['SADURAN INTERNASIONAL','Baru','文','Translasi Berita Asing','Sadur warta internasional dari Reuters, AP, BBC, atau Bloomberg ke dalam gaya jurnalisme portal nasional.',['Sadur Reuters & AP','Multi-Link Rujukan','Konteks Nasional']],['AUDIT & EDITOR DESK','Quality Gatekeeper','✓','Meja Redaktur','Audit kualitas naskah, koreksi EYD V & KBBI, pangkas kalimat sintetis bot, serta uji kepatuhan KEJ.',['Koreksi EYD & KBBI','Uji Kode Etik (KEJ)','Pencegah Wall of Text']],['CTR & SEARCH ENGINE','Traffic Booster','⌕','Headline & SEO','Ciptakan 10 variasi judul atraktif berdaya klik tinggi, kata kunci Google SERP, dan meta deskripsi ramah algoritma.',['Variasi Judul CTR','Google SERP Preview','Meta Deskripsi Portal']],['PRODUKSI KONTEN & MEDSOS','VO & Medsos','◉','Studio Medsos','Ubah naskah berita menjadi narasi Voice Over, storyboard video per scene, dan paket caption medsos multiplatform.',['VO & Storyboard Scene','Estimasi Durasi Video','Caption Multi-Platform']]];
    const cards=document.getElementById('cards');if(cards)cards.innerHTML=modules.map(m=>`<article class="card"><div class="card-top"><span>${m[0]}</span><span class="tag">${m[1]}</span></div><div class="card-icon">${m[2]}</div><h3>${m[3]}</h3><p>${m[4]}</p><div class="features">${m[5].map(x=>`<span class="feature">${x}</span>`).join('')}</div><a class="card-link" href="#" data-module="${m[3]}">Buka Modul →</a></article>`).join('');
    let currentModule='Bikin Berita';
    const selectModule=(module)=>{currentModule=module;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.module===module));document.getElementById('newsWorkflow').style.display=module==='Bikin Berita'?'block':'none';if(module!=='Beranda')window.scrollTo({top:0,behavior:'smooth'})};
    document.querySelectorAll('.nav-item').forEach(x=>x.onclick=()=>selectModule(x.dataset.module));
    document.querySelectorAll('.card-link').forEach(a=>a.onclick=e=>{e.preventDefault();selectModule(a.dataset.module);document.getElementById('topic').value=`Mulai ${a.dataset.module.toLowerCase()}...`;document.getElementById('topic').focus()});
    selectModule('Bikin Berita');
    document.getElementById('researchBtn').onclick=async()=>{const urls=document.getElementById('sourceUrls').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);const status=document.getElementById('researchStatus');if(!urls.length)return status.textContent='Masukkan minimal satu URL.';status.textContent='Mengambil bahan dari sumber...';try{const r=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})});const d=await r.json();const good=d.sources.filter(x=>x.text);document.getElementById('compiledMaterial').value=good.map((x,i)=>`[SUMBER ${i+1}] ${x.url}\n${x.text}${x.captions?.length?`\n\n[CAPTION FOTO]\n${x.captions.join('\n')}`:''}${x.related?.length?`\n\n[BACA JUGA / TERKAIT]\n${x.related.map(r=>r.title+' — '+r.url).join('\n')}`:''}`).join('\n\n');document.getElementById('compiledMaterial').style.display='block';document.getElementById('generateNewsBtn').style.display='inline-block';status.textContent=`${good.length} dari ${d.sources.length} sumber berhasil diambil.`}catch(e){status.textContent='Gagal mengambil sumber: '+e.message}};
    document.getElementById('generateNewsBtn').onclick=async()=>{const material=document.getElementById('compiledMaterial').value.trim();const status=document.getElementById('researchStatus');if(!material)return status.textContent='Bahan berita masih kosong.';const btn=document.getElementById('generateNewsBtn');btn.disabled=true;btn.textContent='Menyusun berita...';status.textContent='AI sedang menyusun draf berdasarkan bahan dan gaya yang dipilih...';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:material,module:'Bikin Berita',angle:document.getElementById('newsStyle').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal membuat draf');status.textContent=`Draf berhasil dibuat: ${d.draft.article.title}`;const a=d.draft.article;const result=document.getElementById('generatedArticle');result.style.display='block';result.innerHTML=`<div style="font-size:11px;color:#0788d1;font-weight:700;letter-spacing:.08em">DRAF BERITA • ${d.draft.mode==='ai'?'AI 9ROUTER':'LOCAL FALLBACK'}</div><h2 style="font-family:'Plus Jakarta Sans';font-size:24px;margin:8px 0 10px">${a.title||'Tanpa judul'}</h2><p style="font-weight:700;line-height:1.6">${a.lead||''}</p><div style="white-space:pre-wrap;color:var(--muted);line-height:1.75">${a.body||''}</div><h3 style="font-size:14px;margin:20px 0 8px">5W+1H</h3>${a.fiveWOneH?`<div style="display:grid;gap:6px;color:var(--muted);font-size:13px"><div><b>Who:</b> ${a.fiveWOneH.who||'-'}</div><div><b>What:</b> ${a.fiveWOneH.what||'-'}</div><div><b>When:</b> ${a.fiveWOneH.when||'-'}</div><div><b>Where:</b> ${a.fiveWOneH.where||'-'}</div><div><b>Why:</b> ${a.fiveWOneH.why||'-'}</div><div><b>How:</b> ${a.fiveWOneH.how||'-'}</div></div>`:''}<h3 style="font-size:14px;margin:20px 0 8px">Checklist redaksi</h3><ul style="color:var(--muted);line-height:1.7">${(a.checklist||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;const headings=[...result.querySelectorAll('h3')];const w=headings.find(x=>x.textContent==='5W+1H');const q=headings.find(x=>x.textContent==='Kutipan narasumber');if(q){let n=q;while(n&&n!==w){const next=n.nextElementSibling;n.remove();n=next}}const copy=document.createElement('button');copy.className='primary';copy.textContent='Salin Judul, Isi & Kutipan';copy.style.marginBottom='14px';copy.onclick=async()=>{const quotes=(a.quotes||[]).map(q=>`“${q.text}” — ${q.speaker||'Narasumber'}${q.role?', '+q.role:''}`).join('\n');const text=`${a.title||''}\n\n${a.body||''}${quotes?`\n\n${quotes}`:''}`;await navigator.clipboard.writeText(text);copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin Judul, Isi & Kutipan',1500)};result.prepend(copy);result.querySelectorAll('.title-choice').forEach(x=>x.onclick=()=>{result.querySelector('h2').textContent=x.dataset.title;a.title=x.dataset.title});fetch('/api/drafts').then(r=>r.json()).then(({drafts})=>{if(drafts?.length){document.querySelector('.empty').innerHTML=drafts.slice(0,3).map(x=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e7eef5;text-align:left"><b>${x.article.title}</b><small>${new Date(x.updatedAt).toLocaleDateString('id-ID')}</small></div>`).join('')}})}catch(e){status.textContent='Gagal membuat draf: '+e.message}finally{btn.disabled=false;btn.textContent='Buat Draf Berita →'}};
    fetch('/api/drafts').then(r=>r.json()).then(({drafts})=>{if(drafts?.length){const e=document.querySelector('.empty');e.innerHTML=drafts.slice(0,3).map(d=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e7eef5;text-align:left"><b>${d.article.title}</b><small>${new Date(d.updatedAt).toLocaleDateString('id-ID')}</small></div>`).join('')}}).catch(()=>{});
  </script>
  <div id="settingsModal" style="display:none;position:fixed;inset:0;background:#14213d66;z-index:10;align-items:center;justify-content:center;padding:20px"><form id="settingsForm" style="background:#fff;border-radius:22px;padding:26px;max-width:500px;width:100%;box-shadow:0 20px 60px #14213d33"><h2 style="margin:0 0 6px;font-family:'Plus Jakarta Sans'">Pengaturan AI</h2><p style="color:#657897;font-size:13px;margin:0 0 20px">API key disimpan lokal di komputer ini dan tidak ditampilkan kembali secara penuh.</p><label style="display:block;font-size:12px;font-weight:700;margin:12px 0 6px">Provider</label><input name="provider" value="9router" style="width:100%;padding:11px;border:1px solid #dce5ef;border-radius:10px"><label style="display:block;font-size:12px;font-weight:700;margin:12px 0 6px">Base URL</label><input name="baseUrl" value="https://api.9router.com/v1" style="width:100%;padding:11px;border:1px solid #dce5ef;border-radius:10px"><label style="display:block;font-size:12px;font-weight:700;margin:12px 0 6px">Model</label><input name="model" placeholder="Nama model dari 9Router" style="width:100%;padding:11px;border:1px solid #dce5ef;border-radius:10px"><label style="display:block;font-size:12px;font-weight:700;margin:12px 0 6px">API Key</label><input name="apiKey" type="password" placeholder="Masukkan API key baru; kosongkan jika tidak diubah" style="width:100%;padding:11px;border:1px solid #dce5ef;border-radius:10px"><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:22px"><button type="button" id="settingsCancel" style="padding:11px 15px;border:1px solid #dce5ef;background:#fff;border-radius:10px">Batal</button><button class="primary" type="submit">Simpan Pengaturan</button></div><div id="settingsStatus" style="font-size:12px;color:#087bc2;margin-top:12px"></div></form></div>
  <script>
    const modal=document.getElementById('settingsModal');
    document.getElementById('settingsOpen').onclick=async()=>{modal.style.display='flex';const r=await fetch('/api/settings');const s=await r.json();const f=document.getElementById('settingsForm');f.provider.value=s.provider||'9router';f.baseUrl.value=s.baseUrl||'';f.model.value=s.model||'';document.getElementById('settingsStatus').textContent=s.hasApiKey?`API key tersimpan: ${s.apiKeyHint}`:'Belum ada API key tersimpan.'};
    document.getElementById('settingsCancel').onclick=()=>modal.style.display='none';
    document.getElementById('settingsForm').onsubmit=async(e)=>{e.preventDefault();const f=e.target;const payload={provider:f.provider.value,baseUrl:f.baseUrl.value,model:f.model.value};if(f.apiKey.value)payload.apiKey=f.apiKey.value;const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const s=await r.json();document.getElementById('settingsStatus').textContent=s.ok?`Tersimpan. API key: ${s.apiKeyHint||'belum diisi'}`:(s.error||'Gagal menyimpan')};
  </script>
</body>
</html>
